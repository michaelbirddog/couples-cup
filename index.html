<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Couples Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020;--bg2:#121a31;--card:#18213b;--line:#2a365c;
  --text:#f6f1e6;--muted:#9aa3bd;--gold:#e7c15a;--gold2:#f6d98a;
  --a:#6ea8ff;--b:#ff7a5c;--win:#3dd68c;--lose:#ff6b7a;--bye:#8b90a5;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#24315a 0%,var(--bg) 55%);color:var(--text);font-family:Outfit,system-ui,sans-serif;min-height:100%}
button,input{font:inherit}
h1,h2,h3,.brand{font-family:Fraunces,Georgia,serif}
.app{max-width:980px;margin:0 auto;padding:16px 14px 80px}
.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.brand{margin:0;font-size:28px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--gold);color:#1a1406;font-weight:700;cursor:pointer}
.btn.secondary{background:#243056;color:var(--text)}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid #3d4a74}
.btn.danger{background:#5a2430;color:#ffd0d6}
.card{background:linear-gradient(180deg,#1b2544,#151d36);border:1px solid var(--line);border-radius:18px;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
input[type=text],input[type=number]{width:100%;background:#0e1528;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px}
.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0;padding-bottom:4px}
.tab{border:1px solid var(--line);background:#121a31;color:var(--muted);border-radius:999px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--gold);color:#1a1406;font-weight:700;border-color:transparent}
.slot{margin:0 0 12px;padding:12px;border-radius:16px;border:1px solid var(--line);background:#141c35}
.slot.now{border-color:var(--gold);box-shadow:0 0 0 1px rgba(231,193,90,.35)}
.slot-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.match{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px;border-radius:12px;margin:6px 0;cursor:pointer;border:1px solid transparent}
.match.a{background:rgba(110,168,255,.12);border-color:rgba(110,168,255,.25)}
.match.b{background:rgba(255,122,92,.12);border-color:rgba(255,122,92,.25)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tag.a{color:var(--a)}
.tag.b{color:var(--b)}
.names{font-weight:600}
.score{font-variant-numeric:tabular-nums;font-weight:700;min-width:64px;text-align:right}
.bye{color:var(--bye);font-size:13px;padding:4px 2px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line)}
.table td{padding:8px 6px;border-bottom:1px solid #223056}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#243056;font-size:12px}
.matrix{width:100%;border-collapse:collapse;font-size:12px}
.matrix th,.matrix td{border:1px solid var(--line);padding:8px;text-align:center}
.matrix th{color:var(--muted);font-weight:500}
.ok{color:var(--win);font-weight:700}
.miss{color:var(--muted)}
.champ{background:linear-gradient(90deg,#3a2d12,#2a2412);border:1px solid #7a6230;padding:14px;border-radius:16px;margin:0 0 12px}
.modal{position:fixed;inset:0;background:rgba(5,8,16,.72);display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:20}
.modal.show{display:flex}
.sheet{width:min(520px,100%);background:#161e38;border:1px solid var(--line);border-radius:20px 20px 16px 16px;padding:16px}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.progress{height:6px;background:#243056;border-radius:99px;overflow:hidden;margin:8px 0 0}
.bar{height:100%;background:linear-gradient(90deg,var(--a),var(--gold),var(--b));width:0}
@media(max-width:700px){.grid2{grid-template-columns:1fr}.brand{font-size:24px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1 class="brand" id="titleView">Couples Cup</h1>
      <div class="sub" id="progressText">Five couples. Two games. Everyone plays everyone.</div>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </div>
    <div class="row">
      <button class="btn secondary" id="shareBtn" type="button">Copy link</button>
      <button class="btn ghost" id="setupBtn" type="button">Setup</button>
    </div>
  </div>

  <div class="card" id="setupCard">
    <h2 style="margin:0 0 8px">Set the field</h2>
    <p class="note">Round robin, not double elimination. With 5 couples a bracket cannot make every pair play both games. This board does: 10 slots, both games at once, one couple sits each slot.</p>
    <label>Event name</label>
    <input id="titleIn" type="text" maxlength="48" placeholder="Couples Cup">
    <div class="grid2" style="margin-top:10px">
      <div><label>Game A</label><input id="game0" type="text" maxlength="24" placeholder="Cornhole"></div>
      <div><label>Game B</label><input id="game1" type="text" maxlength="24" placeholder="Bags / Pong"></div>
    </div>
    <div class="grid2" style="margin-top:10px" id="coupleInputs"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="startBtn" type="button">Open the board</button>
      <button class="btn danger" id="resetBtn" type="button">Reset scores</button>
    </div>
  </div>

  <div id="board" hidden>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="modalTitle" style="margin:0 0 10px">Enter score</h3>
    <div class="grid2">
      <div><label id="lab0"></label><input id="s0" type="number" inputmode="numeric"></div>
      <div><label id="lab1"></label><input id="s1" type="number" inputmode="numeric"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="saveScore" type="button">Save</button>
      <button class="btn secondary" id="clearScore" type="button">Clear</button>
      <button class="btn ghost" id="closeModal" type="button">Close</button>
    </div>
  </div>
</div>

<script>
const SLOTS = [
  {a:[0,1],b:[3,4],bye:2},{a:[0,2],b:[1,4],bye:3},{a:[0,3],b:[2,4],bye:1},
  {a:[0,4],b:[2,3],bye:1},{a:[1,2],b:[0,4],bye:3},{a:[1,3],b:[0,2],bye:4},
  {a:[1,4],b:[0,3],bye:2},{a:[2,3],b:[0,1],bye:4},{a:[2,4],b:[1,3],bye:0},
  {a:[3,4],b:[1,2],bye:0}
];
const CIRCLE = [
  {m:[[1,4],[2,3]],bye:0},{m:[[0,4],[1,2]],bye:3},{m:[[0,3],[2,4]],bye:1},
  {m:[[0,2],[1,3]],bye:4},{m:[[0,1],[3,4]],bye:2}
];
const KEY = "couples-cup-v1";
const TABS = ["schedule","standings","matrix","finals","share"];

function defState(){
  return {
    title:"Couples Cup",
    couples:["Couple 1","Couple 2","Couple 3","Couple 4","Couple 5"],
    games:["Game A","Game B"],
    scores:{},
    finals:{},
    started:false,
    tab:"schedule",
    mode:"parallel"
  };
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":"&#39;"}[c]));}
function sk(g,i,j){const a=Math.min(i,j),b=Math.max(i,j);return g+":"+a+"-"+b;}
function getScore(g,i,j){
  const raw=state.scores[sk(g,i,j)];
  if(!raw) return null;
  const lo=Math.min(i,j)===i?raw[0]:raw[1];
  const hi=Math.min(i,j)===i?raw[1]:raw[0];
  if(lo===null||hi===null||lo===""||hi==="") return null;
  const a=Number(lo),b=Number(hi);
  if(Number.isNaN(a)||Number.isNaN(b)) return null;
  return [a,b];
}
function setScore(g,i,j,a,b){
  const key=sk(g,i,j);
  if(a===null||b===null||a===""||b===""){delete state.scores[key];return;}
  const na=Number(a),nb=Number(b);
  if(Math.min(i,j)===i) state.scores[key]=[na,nb];
  else state.scores[key]=[nb,na];
}
function encode(obj){
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decode(s){
  s=s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  return JSON.parse(decodeURIComponent(escape(atob(s))));
}
function load(){
  try{if(location.hash.length>1) return Object.assign(defState(), decode(location.hash.slice(1)));}catch(e){}
  try{const raw=localStorage.getItem(KEY); if(raw) return Object.assign(defState(), JSON.parse(raw));}catch(e){}
  return defState();
}
function save(){
  localStorage.setItem(KEY, JSON.stringify(state));
  history.replaceState(null,"","#"+encode(state));
}
function playedCount(){
  let n=0;
  for(let g=0;g<2;g++) for(let i=0;i<5;i++) for(let j=i+1;j<5;j++) if(getScore(g,i,j)) n++;
  return n;
}
function standings(game){
  const rows=state.couples.map((name,i)=>({i,name,w:0,l:0,t:0,pf:0,pa:0,gp:0}));
  const games=game===undefined?[0,1]:[game];
  games.forEach(g=>{
    for(let i=0;i<5;i++) for(let j=i+1;j<5;j++){
      const s=getScore(g,i,j); if(!s) continue;
      rows[i].pf+=s[0]; rows[i].pa+=s[1]; rows[i].gp++;
      rows[j].pf+=s[1]; rows[j].pa+=s[0]; rows[j].gp++;
      if(s[0]>s[1]){rows[i].w++;rows[j].l++;}
      else if(s[1]>s[0]){rows[j].w++;rows[i].l++;}
      else {rows[i].t++;rows[j].t++;}
    }
  });
  rows.forEach(r=>{r.pd=r.pf-r.pa; r.pts=r.w*3+r.t;});
  rows.sort((a,b)=>b.pts-a.pts||b.w-a.w||b.pd-a.pd||b.pf-a.pf);
  return rows;
}
function firstOpenSlot(){
  for(let i=0;i<SLOTS.length;i++){
    const sl=SLOTS[i];
    if(!getScore(0,sl.a[0],sl.a[1])||!getScore(1,sl.b[0],sl.b[1])) return i;
  }
  return -1;
}

let state=load();
let modalCtx=null;

function coupleInputs(){
  const box=document.getElementById("coupleInputs");
  box.innerHTML=state.couples.map((c,i)=>`<div><label>Couple ${i+1}</label><input data-c="${i}" type="text" maxlength="28" value="${esc(c)}"></div>`).join("");
}
function fillSetup(){
  document.getElementById("titleIn").value=state.title;
  document.getElementById("game0").value=state.games[0];
  document.getElementById("game1").value=state.games[1];
  coupleInputs();
}
function readSetup(){
  state.title=document.getElementById("titleIn").value.trim()||"Couples Cup";
  state.games[0]=document.getElementById("game0").value.trim()||"Game A";
  state.games[1]=document.getElementById("game1").value.trim()||"Game B";
  document.querySelectorAll("#coupleInputs input").forEach(inp=>{
    state.couples[+inp.dataset.c]=inp.value.trim()||("Couple "+(+inp.dataset.c+1));
  });
}
function matchRow(g,pair,cls){
  const s=getScore(g,pair[0],pair[1]);
  const score=s?`${s[0]} – ${s[1]}`:`Tap score`;
  return `<div class="match ${cls}" data-g="${g}" data-i="${pair[0]}" data-j="${pair[1]}">
    <div><div class="tag ${cls}">${esc(state.games[g])}</div><div class="names">${esc(state.couples[pair[0]])} vs ${esc(state.couples[pair[1]])}</div></div>
    <div class="score">${score}</div></div>`;
}
function renderSchedule(){
  if(state.mode==="sequential"){
    return `<div class="row" style="margin-bottom:10px"><button class="btn secondary" id="modeBtn">View parallel slots</button></div>`+
      [0,1].map(g=>`<h3>${esc(state.games[g])}</h3>`+CIRCLE.map((r,idx)=>{
        return `<div class="slot"><div class="slot-h">Round ${idx+1}</div>${r.m.map(p=>matchRow(g,p,g?"b":"a")).join("")}<div class="bye">Bye: ${esc(state.couples[r.bye])}</div></div>`;
      }).join("")).join("");
  }
  const now=firstOpenSlot();
  return `<div class="row" style="margin-bottom:10px"><button class="btn secondary" id="modeBtn">View by game</button></div>`+
    SLOTS.map((sl,idx)=>`<div class="slot ${idx===now?"now":""}"><div class="slot-h"><span>Slot ${idx+1} of 10</span><span>${idx===now?"Now playing":""}</span></div>${matchRow(0,sl.a,"a")}${matchRow(1,sl.b,"b")}<div class="bye">Bye: ${esc(state.couples[sl.bye])}</div></div>`).join("");
}
function tableFor(rows,heading){
  return `<h3>${heading}</h3><table class="table"><thead><tr><th>#</th><th>Couple</th><th>W-L-T</th><th>PD</th><th>PF</th></tr></thead><tbody>`+
    rows.map((r,n)=>`<tr><td>${n+1}</td><td>${esc(r.name)}</td><td>${r.w}-${r.l}-${r.t}</td><td>${r.pd>0?"+":""}${r.pd}</td><td>${r.pf}</td></tr>`).join("")+
    `</tbody></table>`;
}
function renderStandings(){
  const comb=standings();
  const champ=playedCount()?`<div class="champ"><strong>Combined leader:</strong> ${esc(comb[0].name)} · ${comb[0].w}-${comb[0].l}-${comb[0].t} · PD ${comb[0].pd>0?"+":""}${comb[0].pd}</div>`:"";
  return champ+tableFor(standings(0),state.games[0])+tableFor(standings(1),state.games[1])+tableFor(comb,"Combined");
}
function renderMatrix(){
  const head=`<tr><th></th>`+state.couples.map(c=>`<th>${esc(c)}</th>`).join("")+`</tr>`;
  function grid(g){
    let html=`<h3>${esc(state.games[g])}</h3><table class="matrix">`+head;
    for(let i=0;i<5;i++){
      html+=`<tr><th>${esc(state.couples[i])}</th>`;
      for(let j=0;j<5;j++){
        if(i===j){html+=`<td class="miss">—</td>`;continue;}
        const s=getScore(g,i,j);
        html+=s?`<td class="ok">${s[0]}-${s[1]}</td>`:`<td class="miss">○</td>`;
      }
      html+=`</tr>`;
    }
    return html+`</table>`;
  }
  return `<p class="note">Every off-diagonal cell should fill in both tables. That is the whole point of this format.</p>`+grid(0)+grid(1);
}
function finalBlock(g){
  const rows=standings(g);
  const done=[...Array(10)].every((_,n)=>{const i=n%5,j=Math.floor(n/2);return true;});
  const complete=(()=>{let c=0;for(let i=0;i<5;i++)for(let j=i+1;j<5;j++) if(getScore(g,i,j))c++;return c===10;})();
  const a=rows[0],b=rows[1];
  const key="F"+g;
  const fs=state.finals[key];
  const score=fs&&fs[0]!=null&&fs[1]!=null?`${fs[0]} – ${fs[1]}`:(complete?"Tap to play final":"Need all 10 matches");
  return `<div class="card" style="margin-bottom:10px"><div class="tag ${g?"b":"a"}">${esc(state.games[g])} final</div>
    <div class="match ${g?"b":"a"}" data-final="${g}" style="margin-top:8px">
      <div class="names">${esc(a.name)} vs ${esc(b.name)}</div><div class="score">${score}</div></div>
    <div class="note">1st vs 2nd from the ${esc(state.games[g])} table${complete?"":" (preview based on current standings)"}.</div></div>`;
}
function renderFinals(){
  return `<p class="note">Optional championships after the round robin. Not double elimination — just a title match per game.</p>`+finalBlock(0)+finalBlock(1);
}
function renderShare(){
  const url=location.href;
  const qr="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+encodeURIComponent(url);
  return `<div class="card"><h3 style="margin-top:0">Share with the group</h3>
    <p class="note">Scores live in this page and in the URL. One person should be scorekeeper. After updates, copy the link again so everyone refreshes the same board. This is not live-sync across phones unless they open the new link.</p>
    <div class="row"><button class="btn" id="copy2" type="button">Copy live link</button></div>
    <p class="note" style="margin-top:12px">Scan from another phone:</p>
    <img alt="QR" width="220" height="220" style="border-radius:12px;background:#fff;padding:8px" src="${qr}"></div>`;
}
function render(){
  document.getElementById("titleView").textContent=state.title;
  const n=playedCount();
  document.getElementById("progressText").textContent=`${n} / 20 matches · ${esc(state.games[0])} + ${esc(state.games[1])}`;
  document.getElementById("bar").style.width=(n/20*100)+"%";
  document.getElementById("setupCard").hidden=state.started;
  document.getElementById("board").hidden=!state.started;
  if(!state.started){fillSetup();return;}
  document.getElementById("tabs").innerHTML=TABS.map(t=>`<button class="tab ${state.tab===t?"on":""}" data-tab="${t}">${t}</button>`).join("");
  const view=document.getElementById("view");
  view.innerHTML=state.tab==="schedule"?renderSchedule():state.tab==="standings"?renderStandings():state.tab==="matrix"?renderMatrix():state.tab==="finals"?renderFinals():renderShare();
}
function openModal(g,i,j,isFinal){
  modalCtx={g,i,j,isFinal:!!isFinal};
  document.getElementById("modal").classList.add("show");
  if(isFinal){
    const rows=standings(g);
    document.getElementById("modalTitle").textContent=state.games[g]+" final";
    document.getElementById("lab0").textContent=rows[0].name;
    document.getElementById("lab1").textContent=rows[1].name;
    const fs=state.finals["F"+g]||["",""];
    document.getElementById("s0").value=fs[0]??"";
    document.getElementById("s1").value=fs[1]??"";
  }else{
    document.getElementById("modalTitle").textContent=state.games[g];
    document.getElementById("lab0").textContent=state.couples[i];
    document.getElementById("lab1").textContent=state.couples[j];
    const s=getScore(g,i,j);
    document.getElementById("s0").value=s?s[0]:"";
    document.getElementById("s1").value=s?s[1]:"";
  }
  document.getElementById("s0").focus();
}
function copyLink(){
  save();
  const url=location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>alert("Link copied. Send it to the group.")).catch(()=>prompt("Copy this link",url));
  } else prompt("Copy this link",url);
}
document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]");
  if(tab){state.tab=tab.dataset.tab;save();render();return;}
  if(e.target.id==="startBtn"){readSetup();state.started=true;save();render();return;}
  if(e.target.id==="setupBtn"){state.started=false;save();render();return;}
  if(e.target.id==="resetBtn"){
    if(confirm("Clear all scores? Names stay.")){state.scores={};state.finals={};save();render();}
    return;
  }
  if(e.target.id==="shareBtn"||e.target.id==="copy2"){copyLink();return;}
  if(e.target.id==="modeBtn"){state.mode=state.mode==="parallel"?"sequential":"parallel";save();render();return;}
  const fin=e.target.closest("[data-final]");
  if(fin){openModal(+fin.dataset.final,null,null,true);return;}
  const m=e.target.closest(".match[data-g]");
  if(m){openModal(+m.dataset.g,+m.dataset.i,+m.dataset.j,false);return;}
  if(e.target.id==="closeModal"||e.target.id==="modal"){document.getElementById("modal").classList.remove("show");return;}
  if(e.target.id==="clearScore"&&modalCtx){
    if(modalCtx.isFinal) delete state.finals["F"+modalCtx.g];
    else setScore(modalCtx.g,modalCtx.i,modalCtx.j,null,null);
    save();document.getElementById("modal").classList.remove("show");render();return;
  }
  if(e.target.id==="saveScore"&&modalCtx){
    const a=document.getElementById("s0").value,b=document.getElementById("s1").value;
    if(modalCtx.isFinal) state.finals["F"+modalCtx.g]=[a===""?null:Number(a),b===""?null:Number(b)];
    else setScore(modalCtx.g,modalCtx.i,modalCtx.j,a,b);
    save();document.getElementById("modal").classList.remove("show");render();return;
  }
});
fillSetup();
render();
</script>
</body>
</html>
